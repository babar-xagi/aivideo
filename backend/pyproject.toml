[project]
name = "english-coach-backend"
version = "0.1.0"
description = "API for the English speaking coach"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.34,<1",
    "alembic>=1.16,<2",
    "boto3>=1.35,<2",
    "faster-whisper>=1.1,<2",
    "imageio-ffmpeg>=0.6,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]

